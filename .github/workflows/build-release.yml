            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APKs
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          grep -nE "isMinifyEnabled|isShrinkResources" app/build.gradle.kts || true
          gradle assembleRelease

      - name: Locate and Rename Build Artifacts
        run: |
          UNIVERSAL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$UNIVERSAL_APK" ]; then
            echo "Build artifact not found!"
            exit 1
          fi
          
          mkdir -p release-artifacts
          
          NEW_NAME="release-artifacts/TTS-V${{ env.NEW_VERSION }}-universal.apk"
          
          cp "$UNIVERSAL_APK" "$NEW_NAME"
          
          echo "Renamed universal APK to: $NEW_NAME"
          ls -lh "$NEW_NAME"
          
          echo "UNIVERSAL_APK_PATH=$NEW_NAME" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true

          COMMITS=""
          if [ -n "${{ env.LATEST_TAG }}" ] && git rev-parse --verify "${{ env.LATEST_TAG }}" >/dev/null 2>&1; then
            COMMITS=$(git log "${{ env.LATEST_TAG }}..HEAD" --no-merges --pretty=format:"- %s (%h)")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS=$(git log -n 10 --no-merges --pretty=format:"- %s (%h)" 2>/dev/null || true)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- 常规功能更新与稳定性优化"
          fi

          APK_SIZE=$(du -h "${{ env.UNIVERSAL_APK_PATH }}" | cut -f1)
          APK_SHA256=$(sha256sum "${{ env.UNIVERSAL_APK_PATH }}" | awk '{print $1}')

          {
            echo "## 更新内容"
            echo ""
            printf '%s\n' "$COMMITS"
            echo ""
            echo "## 构建信息"
            echo "- 版本号：\`v${{ env.NEW_VERSION }}\` (versionCode: \`${{ env.VERSION_CODE }}\`)"
            echo "- 安装包大小：\`${APK_SIZE}\`"
            echo "- SHA-256：\`${APK_SHA256}\`"
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            ${{ env.UNIVERSAL_APK_PATH }}
          token: ${{ github.token }}
